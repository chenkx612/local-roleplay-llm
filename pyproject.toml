[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay"
version = "0.1.0"
description = "Role-play training and inference utilities"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
local-mlx = ["mlx-lm==0.31.3"]

[project.scripts]
roleplay-chat = "roleplay.chat:main"
roleplay-datagen = "roleplay.datagen:main"
roleplay-inference = "roleplay.inference:main"
roleplay-sft-data = "roleplay.sft_data:main"
roleplay-stage2-sft = "roleplay.stage2_sft:main"
roleplay-stage3-dpo = "roleplay.stage3_dpo:main"
roleplay-stage3-grpo = "roleplay.stage3_grpo:main"
roleplay-stage4-grpo = "roleplay.stage4_grpo:main"
roleplay-grpo-candidates = "roleplay.grpo_candidates:main"
roleplay-dpo-data = "roleplay.dpo_data:main"
roleplay-dpo-editability = "roleplay.dpo_editability:main"

[tool.setuptools.packages.find]
where = ["src"]
