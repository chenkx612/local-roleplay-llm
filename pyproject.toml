[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay"
version = "0.1.0"
description = "Role-play training and inference utilities"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
roleplay-chat = "roleplay.chat:main"

[tool.setuptools.packages.find]
where = ["src"]
