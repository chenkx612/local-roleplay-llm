rlhf_type: grpo
model: Qwen/Qwen3.5-2B
model_revision: 965dcc54bc9c0591873df0e9869c056a54d323d1
use_hf: true

dataset: __GRPO_DATA__
split_dataset_ratio: 0.0

tuner_type: lora
adapters:
  - output/morgana-v2/stage2-sft/final/adapter
ref_adapters:
  - output/morgana-v2/stage2-sft/final/adapter
target_modules:
  - all-linear
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

torch_dtype: float32
fp16: false
bf16: false
quant_method: bnb
quant_bits: 4
bnb_4bit_compute_dtype: float32
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
lora_dtype: float32

max_length: 1024
max_completion_length: 256
num_generations: 4
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
learning_rate: 1.0e-6
beta: 0.04
num_iterations: 1

temperature: 0.6
top_p: 0.8
top_k: 20
repetition_penalty: 1.45
enable_thinking: false
add_non_thinking_prefix: true
packing: false
padding_free: false
use_vllm: false
gradient_checkpointing: true

external_plugins:
  - src/roleplay/grpo_reward_plugin.py
reward_funcs:
  - morgana_reward

logging_steps: 1
log_completions: true
save_strategy: epoch
save_total_limit: 1
save_only_model: true
seed: 20260807
data_seed: 20260807
report_to: none
output_dir: __GRPO_OUTPUT__
add_version: false
